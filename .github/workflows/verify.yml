name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: knit
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/service-catalog
          ref: 47d5f627b645013b34357d965b1a84e3ba2de347
          path: service-catalog
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/culpa
          ref: e3db79e01fb4891d22877102b2824b4943ebec0b
          path: culpa
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/minau
          ref: f6617e88f81d7218aeb347a278da6d503b27347e
          path: minau
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test
        working-directory: knit
        run: |
          javac @cmd/compile
          java @cmd/test
          bin/knit --version
      - name: Assemble and smoke test distribution
        working-directory: knit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA:0:12}"
          fi
          sh cmd/distribute "$version"
          mkdir -p "$RUNNER_TEMP/knit-smoke"
          tar -xzf dist/knit-*.tar.gz -C "$RUNNER_TEMP/knit-smoke"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/knit-smoke/knit/bin/knit" --version)
          mkdir -p "$RUNNER_TEMP/knit-project/src/example.app/example"
          printf 'module example.app {}\n' > "$RUNNER_TEMP/knit-project/src/example.app/module-info.java"
          printf 'package example; public class Main {}\n' > "$RUNNER_TEMP/knit-project/src/example.app/example/Main.java"
          (cd "$RUNNER_TEMP/knit-project" && "$RUNNER_TEMP/knit-smoke/knit/bin/knit" compile)
          (cd "$RUNNER_TEMP/knit-project" && "$RUNNER_TEMP/knit-smoke/knit/bin/knit" package example.app)
      - uses: actions/upload-artifact@v4
        with:
          name: knit-cli
          path: |
            knit/dist/knit-*.tar.gz
            knit/dist/knit-*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: jdk25
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: knit-cli
      - name: Attach CLI archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" knit-*.tar.gz knit-*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
