name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  jdk25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: knit
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/service-catalog
          ref: 5265d7bb7549a5325fe39ee26b2ce1f4e4f0aeb3
          path: service-catalog
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/peep
          ref: b97658043f3eead9f62569c16b650432c45aaee5
          path: peep
      - uses: actions/checkout@v4
        with:
          repository: archaic-java/minau
          ref: 7abc609a7092dc6491d9af299499cfe434ad7f23
          path: minau
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test
        working-directory: knit
        run: |
          javac @cmd/compile
          java @cmd/test
          bin/knit --version
      - name: Assemble and smoke test distribution
        working-directory: knit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA:0:12}"
          fi
          sh cmd/distribute "$version"
          mkdir -p "$RUNNER_TEMP/knit-smoke"
          tar -xzf dist/knit-*.tar.gz -C "$RUNNER_TEMP/knit-smoke"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/knit-smoke/knit/bin/knit" --version)
      - uses: actions/upload-artifact@v4
        with:
          name: knit-cli
          path: |
            knit/dist/knit-*.tar.gz
            knit/dist/knit-*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: jdk25
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: knit-cli
      - name: Attach CLI archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" knit-*.tar.gz knit-*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
